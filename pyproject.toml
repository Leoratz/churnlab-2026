[project]
name = "churnlab"
version = "0.1.0"
description = "First MLOps lab"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "mlflow>=3,<4",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
